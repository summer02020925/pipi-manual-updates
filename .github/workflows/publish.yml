name: Publish verified Pipi update
on:
  workflow_dispatch:
    inputs:
      version:
        description: Four-part version of the reviewed draft (for example 0.3.0.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pipi-production-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'summer02020925/pipi-manual-updates' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, verified upstream SHA
        with:
          persist-credentials: false
      - name: Validate and download reviewed draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VERSION -notmatch '^(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})$') { throw 'Invalid version' }
          $tag = 'v' + $env:VERSION
          $latest = & gh api ('repos/' + $env:GITHUB_REPOSITORY + '/releases/latest') --jq .tag_name 2>&1
          if ($LASTEXITCODE -eq 0) {
            $latestTag = ($latest -join '').Trim()
            if ($latestTag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' -or [Version]$env:VERSION -le [Version]$latestTag.Substring(1)) { throw 'Release is not newer than the current stable version' }
          } elseif (($latest -join '') -notmatch 'HTTP 404') { throw 'Cannot verify current stable release' }
          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release.isDraft -or $release.tagName -ne $tag) { throw 'Reviewed draft not found; published assets are immutable for this workflow' }
          New-Item -ItemType Directory -Path payload | Out-Null
          $asset = 'PipiManualFresh-' + $env:VERSION + '-win-x64.zip'
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $asset --dir payload
          if ($LASTEXITCODE -ne 0) { throw 'Draft download failed' }
          $compiler = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -find 'MSBuild\**\Bin\Roslyn\csc.exe' | Select-Object -First 1
          if (!$compiler) { throw 'Verified compiler unavailable' }
          & $compiler /nologo /target:exe /out:SignRelease.exe /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /r:System.Web.Extensions.dll release-tools/UpdateCore.cs release-tools/SignRelease.cs
          if ($LASTEXITCODE -ne 0) { throw 'Signer build failed' }
      - name: Sign reviewed package (secret only in this step)
        shell: pwsh
        env:
          PIPI_UPDATE_SIGNING_KEY_XML: ${{ secrets.PIPI_UPDATE_SIGNING_KEY_XML }}
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'PipiManualFresh-' + $env:VERSION + '-win-x64.zip'
          $url = 'https://github.com/' + $env:GITHUB_REPOSITORY + '/releases/download/v' + $env:VERSION + '/' + $asset
          $expiry = [DateTime]::UtcNow.AddDays(180).ToString('yyyy-MM-ddTHH:mm:ssZ')
          & .\SignRelease.exe (Join-Path payload $asset) $env:VERSION $env:GITHUB_RUN_ID $url release-tools/update-public-key.xml manifest.json $expiry
          if ($LASTEXITCODE -ne 0) { throw 'Signing failed; draft remains unpublished' }
      - name: Publish matching manifest and package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v' + $env:VERSION
          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release.isDraft) { throw 'Release is no longer a draft' }
          $asset = 'PipiManualFresh-' + $env:VERSION + '-win-x64.zip'
          New-Item -ItemType Directory -Path recheck | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $asset --dir recheck
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash (Join-Path recheck $asset)).Hash -ne (Get-FileHash (Join-Path payload $asset)).Hash) { throw 'Package changed after review/signing' }
          gh release upload $tag manifest.json --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Manifest upload failed; draft remains unpublished' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed; verify release status before retrying' }
