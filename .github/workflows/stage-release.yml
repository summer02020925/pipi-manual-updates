name: Stage reviewed binary release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed four-part version
        required: true
        type: string
      staging_commit:
        description: Full staging commit SHA containing exactly one reviewed ZIP
        required: true
        type: string
      blob_sha:
        description: Full Git blob SHA of the reviewed ZIP bytes
        required: true
        type: string
      package_sha256:
        description: Independently reviewed ZIP SHA256
        required: true
        type: string
      package_size:
        description: Exact reviewed ZIP byte length
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pipi-production-release
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'summer02020925/pipi-manual-updates' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      STAGING_COMMIT: ${{ inputs.staging_commit }}
      BLOB_SHA: ${{ inputs.blob_sha }}
      PACKAGE_SHA256: ${{ inputs.package_sha256 }}
      PACKAGE_SIZE: ${{ inputs.package_size }}
      GH_TOKEN: ${{ github.token }}
      GH_HOST: github.com
      GH_DEBUG: ''
      GH_CONFIG_DIR: ${{ runner.temp }}/pipi-stage-gh
    steps:
      # Always use reviewed main workflow/helper, NEVER execute/check out staging content.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify immutable staging commit and bounded binary
        shell: bash
        run: |
          set -euo pipefail
          asset=$(python release-tools/StageRelease.py inputs)
          mkdir -p payload metadata existing verify
          # Each metadata file and the raw binary stream have explicit disk bounds.
          gh api --hostname github.com "repos/summer02020925/pipi-manual-updates/git/commits/$STAGING_COMMIT" | head -c 65537 > metadata/commit.json
          tree=$(python release-tools/StageRelease.py commit metadata/commit.json)
          gh api --hostname github.com "repos/summer02020925/pipi-manual-updates/git/trees/$tree" | head -c 65537 > metadata/tree.json
          python release-tools/StageRelease.py tree metadata/tree.json
          # Bash redirection is byte-preserving. Do not use PowerShell text redirection for ZIP data.
          gh api --hostname github.com -H 'Accept: application/vnd.github.raw+json' "repos/summer02020925/pipi-manual-updates/git/blobs/$BLOB_SHA" | head -c "$((PACKAGE_SIZE + 1))" > "payload/$asset"
          python release-tools/StageRelease.py package "payload/$asset"
      - name: Upload only to the existing draft without overwrite
        shell: bash
        run: |
          set -euo pipefail
          asset=$(python release-tools/StageRelease.py inputs)
          tag="v$VERSION"
          gh api --hostname github.com "repos/summer02020925/pipi-manual-updates/releases/tags/$tag" | head -c 65537 > metadata/release.json
          present=$(python release-tools/StageRelease.py release metadata/release.json)
          if [ "$present" != absent ]; then
            gh api --hostname github.com -H 'Accept: application/octet-stream' "repos/summer02020925/pipi-manual-updates/releases/assets/$present" | head -c "$((PACKAGE_SIZE + 1))" > "existing/$asset"
            python release-tools/StageRelease.py package "existing/$asset"
          else
            # Same concurrency group as publisher; never --clobber or publish here.
            gh api --hostname github.com "repos/summer02020925/pipi-manual-updates/releases/tags/$tag" | head -c 65537 > metadata/preupload.json
            test "$(python release-tools/StageRelease.py release metadata/preupload.json)" = absent
            gh release upload "$tag" "payload/$asset" --repo summer02020925/pipi-manual-updates
          fi
          gh api --hostname github.com "repos/summer02020925/pipi-manual-updates/releases/tags/$tag" | head -c 65537 > metadata/after.json
          uploaded=$(python release-tools/StageRelease.py release metadata/after.json)
          test "$uploaded" != absent
          gh api --hostname github.com -H 'Accept: application/octet-stream' "repos/summer02020925/pipi-manual-updates/releases/assets/$uploaded" | head -c "$((PACKAGE_SIZE + 1))" > "verify/$asset"
          python release-tools/StageRelease.py package "verify/$asset"
          echo 'Draft asset bytes verified. Signing and publication are separate manual workflow actions.'
